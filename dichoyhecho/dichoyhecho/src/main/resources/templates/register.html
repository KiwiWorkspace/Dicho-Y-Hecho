<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account</title>
    <link rel="stylesheet" href="/css/auth.css" />
  </head>

  <body>
    <div class="auth-container">
      <div class="auth-header">
        <h2>Create<span> Acount</span></h2>
        <p>New user registration</p>
      </div>

      <div
        th:if="${error}"
        style="color: #ff4d4d; margin-bottom: 15px; text-align: center"
      >
        <p th:text="${error}"></p>
      </div>

      <form
        th:action="@{/register/enviar-registro}"
        th:object="${users}"
        method="post"
      >
        <div class="form-group">
          <label for="firstName">Firts Name</label>
          <input
            type="text"
            id="firstName"
            th:field="*{firstName}"
            placeholder="Your name"
            required
          />
          <div
            class="error-msg"
            th:if="${#fields.hasErrors('firstName')}"
            th:errors="*{firstName}"
            style="color: #ff4d4d; font-size: 0.8rem"
          ></div>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input
            type="text"
            id="lastName"
            th:field="*{lastName}"
            placeholder="Your last name"
            required
          />
        </div>

        <div class="form-group">
          <label for="userHandle">Username</label>
          <input
            type="text"
            id="userHandle"
            th:field="*{userHandle}"
            placeholder="Your handle"
            required
          />
        </div>

        <div class="form-group">
          <label for="ageUser">Age</label>
          <input
            type="number"
            id="ageUser"
            th:field="*{ageUser}"
            placeholder="user ead"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            th:field="*{password}"
            placeholder="********"
            required
          />
          <div
            class="error-msg"
            th:if="${#fields.hasErrors('password')}"
            th:errors="*{password}"
            style="color: #ff4d4d; font-size: 0.8rem"
          ></div>
        </div>

        <div class="form-group">
          <label for="emailUser">Email</label>
          <input
            type="email"
            id="emailUser"
            th:field="*{emailUser}"
            placeholder="mail@example.com"
            required
          />
          <div
            class="error-msg"
            th:if="${#fields.hasErrors('emailUser')}"
            th:errors="*{emailUser}"
          ></div>
        </div>

        <button type="submit" class="btn-auth">Create Account</button>

        <div class="auth-footer">
          <p>
            Do you already have an account?
            <a th:href="@{/login}">Login here</a>
          </p>
        </div>
      </form>
    </div>
  </body>
</html>
