<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{settings.page.title}">User Settings</title>
  <link rel="stylesheet" href="/css/settings.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;600;700;800&display=swap" rel="stylesheet" />
</head>

<body>
  <aside class="sidebar">
    <div class="sidebar border-end">
      <div class="sidebar-header border-bottom">
        <div class="sidebar-brand">Said and Done</div>
      </div>
      <ul class="sidebar-nav">
        <li class="nav-item">
          <a class="nav-link active" href="/home">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house"
              viewBox="0 0 16 16">
              <path
                d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z" />
            </svg>
            <span th:text="#{sidebar.home}">Home</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/marketplace">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-shop"
              viewBox="0 0 16 16">
            </svg>
            <span th:text="#{nav.marketplace}">Marketplace</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/areasVerdes/greenArea">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-tree"
              viewBox="0 0 16 16">
            </svg>
            <span th:text="#{nav.greenAreas}">Green Areas</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bar-chart"
              viewBox="0 0 16 16">
              <path
                d="M4 11H2v3h2zm5-4H7v7h2zm5-5v12h-2V2zm-2-1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM6 7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zm-5 4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1z" />
            </svg>
            <span th:text="#{sidebar.trends}">Trends</span>
            <span class="badge bg-primary ms-auto">NEW</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/contact">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
              class="bi bi-person-lines-fill" viewBox="0 0 16 16">
              <path
                d="M6 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zM11 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5m.5 2.5a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1zm2 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1zm0 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1z" />
            </svg>
            <span th:text="#{sidebar.contact}">Contact</span>
            <span class="badge bg-primary ms-auto">NEW</span>
          </a>
        </li>
        <li class="nav-title" th:text="#{sidebar.nav_title}">Navegación</li>

        <li class="nav-item nav-group show">
          <a class="nav-link nav-group-toggle" href="#">Guatemala City</a>
          <ul class="nav-group-items">
            <li class="nav-item" th:each="z : ${#numbers.sequence(1, 6)}">
              <a class="nav-link" th:href="@{/zona/{n}(n=${z})}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-square"
                  viewBox="0 0 16 16">
                  <path
                    d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z" />
                </svg>
                <span th:text="#{sidebar.zone} + ' ' + ${z}">Zone 1</span>
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </aside>

  <main class="main-content">
    <section class="settings-card">
      <div class="settings-header">
        <h2 th:text="#{settings.main.title}">Settings</h2>
        <p th:text="#{settings.main.subtitle}">Manage account security.</p>
      </div>

      <form th:action="@{/settings/save}" th:object="${settingsForm}" method="post">
        <div class="form-row">
          <div class="form-group">
            <label th:text="#{settings.label.language}">Language</label>

            <select id="lang-selector" class="form-control" onchange="changeLanguage(this.value)">
              <option value="en" th:selected="${#locale.language == 'en'}">English</option>
              <option value="es" th:selected="${#locale.language == 'es'}">Spanish</option>
              <option value="fr" th:selected="${#locale.language == 'fr'}">French</option>
              <option value="pt" th:selected="${#locale.language == 'pt'}">Portuguese</option>
            </select>
          </div>

          <div class="form-group">
            <label th:text="#{settings.label.timezone}">Timezone</label>
            <select class="form-control">
              <option>GMT-5 (EST)</option>
              <option>GMT+0 (UTC)</option>
            </select>
          </div>
        </div>

        <hr class="separator" />

        <div class="settings-header">
          <h3 th:text="#{settings.title.notifications}">Notifications</h3>
        </div>

        <div class="toggle-group">
          <div class="toggle-item">
            <span th:text="#{settings.notify.email}">Email notifications</span>
            <input type="checkbox" th:field="*{emailNotifications}" />
          </div>
          <div class="toggle-item">
            <span th:text="#{settings.notify.marketing}">Marketing updates</span>
            <input type="checkbox" th:field="*{marketingUpdates}" />
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn-submit" th:text="#{settings.btn.save}">Save Changes</button>
          <button type="button" class="btn-cancel" th:text="#{settings.btn.discard}"
            onclick="window.location.reload();">Discard</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/settings.js"></script>
</body>

</html>
