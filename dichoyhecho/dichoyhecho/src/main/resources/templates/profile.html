<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{profile.page.title}">My Profile - Said And Done</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="profile-layout-body">

    <div class="profile-dashboard-container">

        <aside class="profile-sidebar">
            <div class="sidebar-banner"></div>

            <div class="sidebar-avatar-wrapper">
                <div class="sidebar-avatar">
                    <img th:if="${user.profileImg != null}"
                        th:src="'data:image/jpeg;base64,' + ${user.generateBase64Image()}" alt="Profile Image" />
                    <span th:if="${user.profileImg == null}" th:text="${user.firstName.substring(0,1)}">C</span>
                </div>
                <span class="sidebar-status"></span>
            </div>

            <div class="sidebar-user-info">
                <h2 th:text="${user.firstName + ' ' + user.lastName}"></h2>
                <span class="sidebar-username" th:text="'@' + ${user.userHandle}"></span>
            </div>

            <div class="sidebar-role-badge">
                <i class="fa-solid fa-user-shield"></i>
                <span th:text="${user.userRole != null ? user.userRole : 'USER'}"></span>
            </div>

            <div class="sidebar-actions">
                <a th:href="@{/home}" class="btn-sidebar-primary">
                    <i class="fa-solid fa-arrow-left"></i> <span th:text="#{profile.btn.back}">Back to Home</span>
                </a>

                <form th:action="@{/logout}" method="post" style="width: 100%;">
                    <button type="submit" class="btn-sidebar-secondary">
                        <i class="fa-solid fa-right-from-bracket"></i> <span
                            th:text="#{profile.btn.logout}">Logout</span>
                    </button>
                </form>
            </div>
        </aside>

        <main class="profile-main-content">

            <div class="content-section">
                <div class="section-header-inline">
                    <div>
                        <h3 th:text="#{profile.section.title}">Account Settings</h3>
                        <p class="section-subtitle" th:text="#{profile.section.subtitle}">Your personal account details
                            from said and done.</p>
                    </div>
                    <a th:href="@{/profile/edit}" class="btn-edit-toggle">
                        <i class="fa-regular fa-pen-to-square"></i> <span th:text="#{profile.btn.edit}">Edit
                            Profile</span>
                    </a>
                </div>

                <div class="profile-editable-grid">
                    <div class="input-profile-group">
                        <label><i class="fa-solid fa-signature"></i> <span th:text="#{profile.label.firstname}">First
                                Name</span></label>
                        <input type="text" th:value="${user.firstName}" readonly />
                    </div>

                    <div class="input-profile-group">
                        <label><i class="fa-solid fa-signature"></i> <span th:text="#{profile.label.lastname}">Last
                                Name</span></label>
                        <input type="text" th:value="${user.lastName}" readonly />
                    </div>

                    <div class="input-profile-group">
                        <label><i class="fa-solid fa-at"></i> <span th:text="#{profile.label.username}">Username
                                Handle</span></label>
                        <input type="text" th:value="${user.userHandle}" readonly />
                    </div>

                    <div class="input-profile-group">
                        <label><i class="fa-regular fa-calendar"></i> <span
                                th:text="#{profile.label.age}">Age</span></label>
                        <input type="text" th:value="|${user.ageUser} #{profile.age.suffix}|" readonly />
                    </div>

                    <div class="input-profile-group full-width">
                        <label><i class="fa-regular fa-envelope"></i> <span th:text="#{profile.label.email}">Email
                                Address</span></label>
                        <input type="email" th:value="${user.emailUser}" readonly />
                    </div>
                </div>
            </div>

            <section class="content-section">
                <h3 th:text="#{profile.activity.title}">Platform Activity</h3>


                <div th:if="${#lists.isEmpty(myComments)}" class="activity-placeholder-box">
                    <div class="placeholder-icon">
                        <i class="fa-regular fa-comment-dots"></i>
                    </div>
                    <h4 th:text="#{profile.activity.subtitle}">You have no posts yet</h4>
                    <p th:text="#{profile.activity.text}">The comments you make in different areas of the city will appear in this space.</p>
                </div>
                <div th:if="${!#lists.isEmpty(myComments)}" class="profile-comments-list" style="margin-top: 20px;">

                    <div th:each="c : ${myComments}" class="comment-card" style="
                        background: rgba(255, 255, 255, 0.03);
                        border: 1px solid rgba(255, 255, 255, 0.08);
                        border-radius: 12px;
                        padding: 16px;
                        margin-bottom: 16px;
                    ">
                        <div class="comment-header" style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem; color: rgba(255,255,255,0.6);">
                            <div>
                                <span class="comment-user" style="font-weight: 600; color: #10b981;" th:text="'@' + ${user.userHandle}">@user</span>
                                <span style="margin: 0 6px;">•</span>
                                <span class="comment-time" th:text="${#temporals.format(c.commentDate, 'dd/MM/yyyy HH:mm')}">Fecha</span>
                            </div>
                            <span class="comment-zone-badge" style="background: rgba(16, 185, 129, 0.15); color: #10b981; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem;">
                                <i class="fa-solid fa-location-dot"></i> Zone <span th:text="${c.idZone}">1</span>
                            </span>
                        </div>
                        <p class="comment-text" style="color: #e5e7eb; font-size: 0.95rem; line-height: 1.5; margin: 0;" th:text="${c.content}">
                            Comment content...
                        </p>
                        <div th:if="${c.imagen != null or c.video != null}" style="margin-top: 12px;">
                            <img th:if="${c.imagen != null}"
                                 th:src="'data:image/jpeg;base64,' + ${c.generateBase64Image()}"
                                 style="max-width: 100%; max-height: 300px; border-radius: 8px; object-fit: cover;" alt="Adjunto" />

                            <video th:if="${c.video != null}"
                                   th:src="'data:video/mp4;base64,' + ${c.generateBase64Video()}"
                                   controls
                                   style="max-width: 100%; max-height: 300px; border-radius: 8px;"></video>
                        </div>
                    </div>

                </div>
            </section>
        </main>

    </div>

</body>

</html>
