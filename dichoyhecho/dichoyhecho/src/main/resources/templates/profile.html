<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Dicho y Hecho</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <style>
        .profile-data-group {
            text-align: left;
            margin-bottom: 25px;
            background: rgba(16, 185, 129, 0.05);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.1);
        }
        .data-item {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding-bottom: 8px;
        }
        .data-label {
            font-weight: 700;
            color: #064e3b;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .data-value {
            color: #374151;
            font-weight: 500;
        }
        .user-handle-badge {
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 8px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="contenedor">
        <div class="tarjeta">
            <h2 class="titulo">My <span>Profile</span></h2>
            <p class="subtitulo">Manage your account information</p>

            <div class="profile-data-group">
                <div class="data-item">
                    <span class="data-label">Name:</span>
                    <span class="data-value" th:text="${user.firstName + ' ' + user.lastName}">Nombre Apellido</span>
                </div>

                <div class="data-item">
                    <span class="data-label">Username</span>
                    <span class="data-value user-handle-badge" th:text="${user.userHandle}">handle</span>
                </div>

                <div class="data-item">
                    <span class="data-label">Email</span>
                    <span class="data-value" th:text="${user.emailUser}">ejemplo@gmail.com</span>
                </div>

                <div class="data-item">
                    <span class="data-label">Age</span>
                    <span class="data-value" th:text="${user.ageUser + ' years old'}">18 años</span>
                </div>

            </div>


            <div class="acciones">
                <a th:href="@{/home}" class="btn-principal" >
                    Back to home
                </a>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-secundario">
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
