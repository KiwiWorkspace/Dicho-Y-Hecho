<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Dicho y Hecho</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <style>

        .tarjeta {
            padding: 0 !important;
            overflow: hidden;
            border-radius: 40px 15px;
            background: #fff;
            border: 3px solid #064e3b;
            box-shadow: 12px 12px 0px #064e3b;
        }


        .profile-banner {
            height: 110px;
            background: linear-gradient(135deg, #064e3b 0%, #10b981 100%);
            width: 100%;
            clip-path: polygon(0 0, 100% 0, 100% 70%, 0% 100%);
        }

        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: -65px auto 15px;
            transform: rotate(-3deg);
        }

        .profile-placeholder {
            width: 100%;
            height: 100%;
            border-radius: 25px;
            border: 4px solid #fff;
            background: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.8rem;
            font-weight: 900;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }

        .status-dot {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: #22c55e;
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.6rem;
            font-weight: 800;
            text-transform: uppercase;
            border: 2px solid white;
            transform: rotate(3deg);
        }


        .profile-data-group {
            background: transparent;
            padding: 0 25px;
            margin-bottom: 20px;
            border: none;
        }

        .data-item {
            background: #f0fdf4;
            margin-bottom: 10px;
            padding: 12px 15px;
            border-radius: 15px;
            border: 1px solid #d1fae5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .data-item:hover {
            transform: translateX(5px);
            border-color: #10b981;
        }

        .data-label {
            font-weight: 800;
            color: #064e3b;
            font-size: 0.7rem;
            opacity: 0.7;
        }

        .data-value {
            color: #064e3b;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .user-handle-badge {
            background: #064e3b;
            color: #34d399;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
        }

        .acciones {
            padding: 0 25px 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-principal {
            background: #10b981;
            color: white;
            border: 2px solid #064e3b;
            border-radius: 12px;
            padding: 12px;
            font-weight: 800;
            box-shadow: 4px 4px 0px #064e3b;
            transition: all 0.1s;
        }

        .btn-principal:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #064e3b;
        }

        .btn-secundario {
            background: #fff;
            color: #ef4444;
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 12px;
            font-weight: 800;
            transition: all 0.2s;
        }

        .btn-secundario:hover {
            background: #fef2f2;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="contenedor">
        <div class="tarjeta">
            <div class="profile-banner"></div>

            <div class="profile-header text-center">
                <div class="avatar-wrapper">
                    <div class="profile-placeholder">
                        <span th:text="${user.firstName.substring(0,1)}">C</span>
                    </div>
                    <span class="status-dot">Online</span>
                </div>

            </div>

            <div class="profile-data-group">
                <div class="data-item">
                    <span class="data-label">Full Name</span>
                    <span class="data-value" th:text="${user.firstName + ' ' + user.lastName}">Cristian Pérez</span>
                </div>

                <div class="data-item">
                    <span class="data-label">Handle</span>
                    <span class="user-handle-badge" th:text="'@' + ${user.userHandle}">@cris</span>
                </div>

                <div class="data-item">
                    <span class="data-label">Email</span>
                    <span class="data-value" style="font-size: 0.8rem;" th:text="${user.emailUser}">ejemplo@kinal.edu.gt</span>
                </div>

                <div class="data-item">
                    <span class="data-label">Age</span>
                    <span class="data-value" th:text="${user.ageUser + ' años'}">17 años</span>
                </div>
            </div>

            <div class="acciones">
                <a th:href="@{/home}" class="btn-principal">
                    HOME
                </a>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-secundario" style="width: 100%;">
                        LOGOUT
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
