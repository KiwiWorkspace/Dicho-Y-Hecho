<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - Tienda Uno</title>
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="contenedor">
        <div class="tarjeta">
          <h2 class="titulo">Dicho y Hecho</h2>
          <p class="subtitulo">Inicie sesión para acceder al sistema</p>

          <div th:if="${param.error}" class="mensaje error">
            Usuario o contraseña incorrectos
          </div>

          <div th:if="${param.logout}" class="mensaje success">
            Sesión cerrada correctamente
          </div>

          <form th:action="@{/login}" method="post">
            <div class="campo">
              <label for="username">Usuario</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Tu usuario"
                required
                autocomplete="username"
              />
            </div>

            <div class="campo">
              <label for="password">Contraseña</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
            </div>

            <button type="submit" class="boton btn-principal">
              Entrar al Sistema
            </button>
          </form>

          <div class="acciones">
            <a th:href="@{/register}" class="boton btn-secundario">
              Regístrate</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
