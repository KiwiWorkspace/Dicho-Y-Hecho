<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - No sooner said than done</title>
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="contenedor">
        <div class="tarjeta">
          <h2 class="titulo">Said and Done</h2>
          <p class="subtitulo">Log in to access the system</p>

          <div th:if="${param.error}" class="mensaje error">
            Incorrect username or password
          </div>

          <div th:if="${param.logout}" class="mensaje success">
            Successfully logged out
          </div>

          <form th:action="@{/login}" method="post">
            <div class="campo">
              <label for="username">User</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Your user"
                required
                autocomplete="username"
              />
            </div>

            <div class="campo">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
            </div>

            <button type="submit" class="boton btn-principal">Log in</button>
          </form>

          <div class="acciones">
            <a th:href="@{/register}" class="boton btn-secundario"> Register</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
