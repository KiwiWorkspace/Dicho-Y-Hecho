<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reportar Problema</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f0fdf4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card {
            width: 100%;
            max-width: 560px;
            padding: 0 !important;
            overflow: hidden;
            border-radius: 40px 15px;
            background: #fff;
            border: 3px solid #064e3b;
            box-shadow: 12px 12px 0px #064e3b;
            animation: slideUp .45s cubic-bezier(.22, .68, 0, 1.2) both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(28px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Header banner ── */
        .profile-banner {
            height: 110px;
            background: linear-gradient(135deg, #064e3b 0%, #10b981 100%);
            width: 100%;
            clip-path: polygon(0 0, 100% 0, 100% 70%, 0% 100%);
        }

        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: -65px auto 15px;
            transform: rotate(-3deg);
        }

        .profile-placeholder {
            width: 100%;
            height: 100%;
            border-radius: 25px;
            border: 4px solid #fff;
            background: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.8rem;
            font-weight: 900;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);
        }

        .status-dot {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: #22c55e;
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.6rem;
            font-weight: 800;
            text-transform: uppercase;
            border: 2px solid white;
            transform: rotate(3deg);
        }

        /* ── Title block ── */
        .card-title-block {
            text-align: center;
            padding: 0 25px 20px;
        }

        .card-title-block h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: #064e3b;
            line-height: 1.2;
        }

        .card-title-block p {
            font-size: .78rem;
            color: #6b7280;
            margin-top: .3rem;
        }

        /* ── Notice / Alert ── */
        .notice {
            margin: 0 25px 20px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-left: 3px solid #f59e0b;
            border-radius: 15px;
            padding: .85rem 1rem;
            display: flex;
            gap: .65rem;
            align-items: flex-start;
            font-size: .82rem;
            color: #92400e;
            line-height: 1.5;
        }

        .alert-success {
            margin: 0 25px 20px;
            background: #f0fdf4;
            border: 1px solid #d1fae5;
            border-left: 3px solid #10b981;
            border-radius: 15px;
            padding: .85rem 1rem;
            display: flex;
            gap: .65rem;
            align-items: flex-start;
            font-size: .82rem;
            color: #064e3b;
            line-height: 1.5;
        }

        /* ── Form fields ── */
        .profile-data-group {
            background: transparent;
            padding: 0 25px;
            margin-bottom: 20px;
            border: none;
        }

        .field {
            margin-bottom: 10px;
        }

        .data-item {
            background: #f0fdf4;
            margin-bottom: 10px;
            padding: 12px 15px;
            border-radius: 15px;
            border: 1px solid #d1fae5;
            transition: transform 0.2s;
        }

        .data-item:hover {
            transform: translateX(5px);
            border-color: #10b981;
        }

        .data-label {
            font-weight: 800;
            color: #064e3b;
            font-size: 0.7rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: .06em;
            display: block;
            margin-bottom: .35rem;
        }

        input,
        textarea,
        select {
            width: 100%;
            background: transparent;
            border: none;
            color: #064e3b;
            font-family: 'DM Sans', sans-serif;
            font-size: .92rem;
            font-weight: 700;
            padding: 0;
            outline: none;
            resize: none;
        }

        input::placeholder,
        textarea::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }

        textarea {
            min-height: 80px;
        }

        select option {
            background: #fff;
            color: #064e3b;
        }

        .field-footer {
            display: flex;
            justify-content: space-between;
            font-size: .72rem;
            color: #9ca3af;
            margin-top: .3rem;
            padding: 0 2px;
        }

        .field-footer span.hint {
            font-style: italic;
        }

        /* ── Checkbox row ── */
        .check-row {
            background: #f0fdf4;
            border: 1px solid #d1fae5;
            border-radius: 15px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: .75rem;
            cursor: pointer;
            margin-bottom: 10px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .check-row:hover {
            transform: translateX(5px);
            border-color: #10b981;
        }

        .check-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #10b981;
            cursor: pointer;
            flex-shrink: 0;
            background: transparent;
            border: none;
            padding: 0;
        }

        .check-label {
            font-size: .88rem;
            color: #064e3b;
            font-weight: 700;
        }

        .check-label span {
            display: block;
            font-size: .75rem;
            color: #6b7280;
            font-weight: 400;
            margin-top: .15rem;
        }

        /* ── Buttons ── */
        .acciones {
            padding: 0 25px 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-principal {
            background: #10b981;
            color: white;
            border: 2px solid #064e3b;
            border-radius: 12px;
            padding: 12px;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: .95rem;
            box-shadow: 4px 4px 0px #064e3b;
            transition: all 0.1s;
            cursor: pointer;
            letter-spacing: .02em;
        }

        .btn-principal:hover {
            filter: brightness(1.08);
        }

        .btn-principal:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #064e3b;
        }

        .btn-secundario {
            background: #fff;
            color: #ef4444;
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 12px;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: .95rem;
            transition: all 0.2s;
            cursor: pointer;
            letter-spacing: .02em;
        }

        .btn-secundario:hover {
            background: #fef2f2;
        }

        .btn-full {
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>
    <div class="card">

        <div class="profile-banner"></div>
        <div class="avatar-wrapper">
            <div class="profile-placeholder"><svg xmlns="http://www.w3.org/2000/svg" width="45" height="45"
                    fill="currentColor" class="bi bi-tools" viewBox="0 0 16 16">
                    <path
                        d="M1 0 0 1l2.2 3.081a1 1 0 0 0 .815.419h.07a1 1 0 0 1 .708.293l2.675 2.675-2.617 2.654A3.003 3.003 0 0 0 0 13a3 3 0 1 0 5.878-.851l2.654-2.617.968.968-.305.914a1 1 0 0 0 .242 1.023l3.27 3.27a.997.997 0 0 0 1.414 0l1.586-1.586a.997.997 0 0 0 0-1.414l-3.27-3.27a1 1 0 0 0-1.023-.242L10.5 9.5l-.96-.96 2.68-2.643A3.005 3.005 0 0 0 16 3q0-.405-.102-.777l-2.14 2.141L12 4l-.364-1.757L13.777.102a3 3 0 0 0-3.675 3.68L7.462 6.46 4.793 3.793a1 1 0 0 1-.293-.707v-.071a1 1 0 0 0-.419-.814zm9.646 10.646a.5.5 0 0 1 .708 0l2.914 2.915a.5.5 0 0 1-.707.707l-2.915-2.914a.5.5 0 0 1 0-.708M3 11l.471.242.529.026.287.445.445.287.026.529L5 13l-.242.471-.026.529-.445.287-.287.445-.529.026L3 15l-.471-.242L2 14.732l-.287-.445L1.268 14l-.026-.529L1 13l.242-.471.026-.529.445-.287.287-.445.529-.026z" />
                </svg></div>
            <div class="status-dot">Nuevo</div>
        </div>

        <div class="card-title-block">
            <h1>Reportar un problema</h1>
            <p>Dicho y Hecho · Sistema de incidencias</p>
        </div>

        <div class="alert-success" th:if="${mensaje}">
            <span>✅</span>
            <span th:text="${mensaje}"></span>
        </div>

        <div class="notice">
            <span>⏳</span>
            <span>Tu solicitud quedará en estado <strong>REPORTED</strong> hasta que un administrador la revise y
                apruebe. Recibirás una notificación si activás la opción de abajo.</span>
        </div>

        <form action="#" th:action="@{/problems/new}" th:object="${problem}" method="post">

            <div class="profile-data-group">

                <div class="data-item field">
                    <label class="data-label" for="type">Descripción del problema</label>
                    <textarea id="type" th:field="*{type}"
                        placeholder="Describe el problema con detalle. Ej: Bache profundo en la calle principal frente al parque central…"
                        minlength="20" maxlength="130"></textarea>
                    <div class="field-footer">
                        <span class="hint">Mín. 20 caracteres</span>
                        <span>130 máx.</span>
                    </div>
                </div>

                <div class="data-item field">
                    <label class="data-label" for="address">Dirección / Ubicación</label>
                    <input type="text" id="address" th:field="*{address}"
                        placeholder="Ej: 5a Avenida 12-34 zona 1, frente al edificio azul" minlength="20"
                        maxlength="120" />
                    <div class="field-footer">
                        <span class="hint">Mín. 20 caracteres</span>
                        <span>120 máx.</span>
                    </div>
                </div>


                <div class="data-item field">
                    <label class="data-label" for="category">Nivel de urgencia</label>
                    <select id="category" th:field="*{category}">
                        <option value="" disabled>Selecciona el nivel de urgencia…</option>
                        <option value="LOW">🟢 Bajo — No es urgente</option>
                        <option value="MODERATE">🟡 Moderado — Requiere atención pronta</option>
                        <option value="HIGH">🟠 Alto — Afecta a varios vecinos</option>
                        <option value="CRITICAL">🔴 Crítico — Peligro inmediato</option>
                    </select>
                </div>


                <label class="check-row">
                    <input type="checkbox" id="notification" th:field="*{notification}" />
                    <div class="check-label">
                        Quiero recibir notificaciones sobre este problema
                        <span>Te avisaremos cuando el estado cambie (aprobado, en progreso, resuelto…)</span>
                    </div>
                </label>

            </div>


            <div class="acciones">
                <button type="submit" class="btn-principal btn-full">📨 Enviar solicitud</button>
            </div>

        </form>

    </div>
</body>

</html>
