<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áreas Verdes - Dicho y Hecho</title>
    <link rel="stylesheet" th:href="@{/css/greenAreas.css}" href="/css/creenAreas.css">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand">Dicho y Hecho</div>

    <ul class="sidebar-nav">
        <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/areasVerdes">Green Areas</a></li>
        <li class="nav-item"><a class="nav-link" href="/profile">Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
    </ul>
</div>

<div class="main-content">

    <div class="header">
        <h1>Green Areas</h1>
        <p>Explore parks and nature</p>
    </div>

    <div class="areas-grid">

        <div class="area-card">
            <img class="area-image" src="https://codigo-postal.org/data/gt/images/cp/01001.webp">

            <div class="area-content">
                <div class="area-title">Zone 1</div>
                <div class="area-description"></div>

                <div class="area-info">
                    <span class="badge">National Palace</span>
                    <span class="location">Zone 1</span>
                </div>

                <input type="checkbox" id="c1" class="toggle">
                <label for="c1" class="btn-area">more</label>

                <div class="extra-list">
                    <a href="#">Bathrooms</a>
                    <a href="#">Parking</a>
                    <a href="#">Playground</a>
                </div>
            </div>
        </div>

        <div class="area-card">
            <img class="area-image" src="https://codigo-postal.org/data/gt/images/cp/01002.webp">

            <div class="area-content">
                <div class="area-title">Zone 2</div>
                <div class="area-description"></div>

                <div class="area-info">
                    <span class="badge">Natural and touristic</span>
                    <span class="location">Zone 2</span>
                </div>

                <input type="checkbox" id="c2" class="toggle">
                <label for="c2" class="btn-area">more</label>

                <div class="extra-list">
                    <a href="#">Guided tours</a>
                    <a href="#">Cafeteria</a>
                    <a href="#">Shop</a>
                </div>
            </div>
        </div>

        <div class="area-card">
            <img class="area-image" src="https://codigo-postal.org/data/gt/images/cp/01003.webp">

            <div class="area-content">
                <div class="area-title">Zone 3</div>
                <div class="area-description"></div>

                <div class="area-info">
                    <span class="badge">cemetery</span>
                    <span class="location">Zone 3</span>
                </div>

                <input type="checkbox" id="c3" class="toggle">
                <label for="c3" class="btn-area">more</label>

                <div class="extra-list">
                    <a href="#">Camping</a>
                    <a href="#">Trails</a>
                    <a href="#">Sports courts</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
