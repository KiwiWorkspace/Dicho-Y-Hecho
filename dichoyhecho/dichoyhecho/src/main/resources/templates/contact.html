<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - eFootball</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/contact.css}">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">E<span th:style="'color: var(--primary)'">FOOTBALL</span></div>
        </div>
        
        <div class="sidebar-nav">
            <p class="nav-title">Home</p>
            <a th:href="@{/home}" class="nav-link">
                <i class="fas fa-home"></i> Start
            </a>

            
            <p class="nav-title">User</p>
            <div class="user-profile-compact px-3">
                <a href="#" class="profile-button">
                    <i class="fas fa-user-circle fa-lg"></i>
                    <span>my profile</span>
                </a>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="contact-card">
            <h1 class="text-center mb-4">Contact</h1>
            <p class="text-center mb-4" style="opacity: 0.8;">
                Do you have questions about our services or need to report bugs? Contact us.
            </p>

            <form th:action="@{/contact}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Your name here..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <input type="text" name="asunto" class="form-control" placeholder="Ej: Soporte Técnico">
                </div>

                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea name="mensaje" class="form-control" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane me-2"></i> Submit Form
                </button>

                <div th:if="${success}" class="alert alert-success mt-3 border-0 bg-success text-white">
                    ✅ Data sent successfully!
                </div>
            </form>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
