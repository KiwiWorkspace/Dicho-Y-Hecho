    <main class="main-content">
        <div class="contact-card">
            <h1 class="text-center mb-4">Contact</h1>
            <p class="text-center mb-4" style="opacity: 0.8;">
                Do you have questions about our services or need to report bugs? Contact us.
            </p>

            <form th:action="@{/contact}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Full Name</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Your name here..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Subject</label>
                    <input type="text" name="asunto" class="form-control" placeholder="Ej: Technical Support">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Message</label>
                    <textarea name="mensaje" class="form-control" rows="4" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane me-2"></i> Submit Form
                </button>

                <div th:if="${success}" class="alert alert-success mt-4 border-0 text-white shadow-lg" style="background-color: var(--primary);">
                    <i class="fas fa-check-circle me-2"></i> Data sent successfully!
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
