    <main class="contact-page">
        <div class="contact-container">

            <div class="contact-header">
                <h1 th:text="#{contact.main.title}">Contact Us</h1>
                <p th:text="#{contact.main.subtitle}">Do you have questions about our services or need to report bugs?
                    Contact us.</p>
            </div>

            <div class="contact-form-card">
                <form th:action="@{/contact}" method="POST">

                    <div class="form-group">
                        <label for="nombre" th:text="#{contact.label.name}">Full Name</label>
                        <input type="text" id="nombre" name="nombre" class="form-control"
                            th:placeholder="#{contact.placeholder.name}" placeholder="Your name here..." required>
                    </div>

                    <div class="form-group">
                        <label for="email" th:text="#{contact.label.email}">Email</label>
                        <input type="email" id="email" name="email" class="form-control"
                            th:placeholder="#{contact.placeholder.email}" placeholder="example@mail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="asunto" th:text="#{contact.label.subject}">Subject</label>
                        <input type="text" id="asunto" name="asunto" class="form-control"
                            th:placeholder="#{contact.placeholder.subject}" placeholder="e.g., Technical Support">
                    </div>

                    <div class="form-group">
                        <label for="mensaje" th:text="#{contact.label.message}">Message</label>
                        <textarea id="mensaje" name="mensaje" class="form-control" rows="4"
                            th:placeholder="#{contact.placeholder.message}" placeholder="Write your message here..."
                            required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane me-2"></i>
                        <span th:text="#{contact.btn.submit}">Send Message</span>
                    </button>

                    <div th:if="${success}" class="success-message">
                        <i class="fas fa-check-circle"></i>
                        <span th:text="#{contact.msg.success}">Data sent successfully!</span>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
