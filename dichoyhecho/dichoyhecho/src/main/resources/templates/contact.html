<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{contact.page.title}">Contact - Said And Done</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/contact.css}" href="/css/contact.css">
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar border-end">
            <div class="sidebar-header border-bottom">
                <div class="sidebar-brand">Said and Done</div>
            </div>
            <ul class="sidebar-nav">
                <li class="nav-item">
                    <a class="nav-link active" href="/home">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-house" viewBox="0 0 16 16">
                            <path
                                d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z" />
                        </svg>
                        <span th:text="#{sidebar.home}">Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-bar-chart" viewBox="0 0 16 16">
                            <path
                                d="M4 11H2v3h2zm5-4H7v7h2zm5-5v12h-2V2zm-2-1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM6 7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zm-5 4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1z" />
                        </svg>
                        <span th:text="#{sidebar.trends}">Trends</span>
                        <span class="badge bg-primary ms-auto">NEW</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/contact">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-person-lines-fill" viewBox="0 0 16 16">
                            <path
                                d="M6 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zM11 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5m.5 2.5a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1zm2 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1zm0 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1z" />
                        </svg>
                        <span th:text="#{sidebar.contact}">Contact</span>
                        <span class="badge bg-primary ms-auto">NEW</span>
                    </a>
                </li>
                <li class="nav-title" th:text="#{sidebar.nav_title}">Navegación</li>
                <li class="nav-item nav-group show">
                    <a class="nav-link nav-group-toggle" href="#">Guatemala City</a>
                    <ul class="nav-group-items">
                        <li class="nav-item" th:each="z : ${#numbers.sequence(1, 6)}">
                            <a class="nav-link" th:href="@{/zona/{n}(n=${z})}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                    class="bi bi-square" viewBox="0 0 16 16">
                                    <path
                                        d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z" />
                                </svg>
                                <span th:text="#{sidebar.zone} + ' ' + ${z}">Zone 1</span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </aside>

    <main class="main-content">
        <div class="contact-card">
            <h1 class="text-center mb-4" th:text="#{contact.main.title}">Contact</h1>
            <p class="text-center mb-4" style="opacity: 0.8;" th:text="#{contact.main.subtitle}">
                Do you have questions about our services or need to report bugs? Contact us.
            </p>

            <form th:action="@{/contact}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold" th:text="#{contact.label.name}">Full Name</label>
                    <input type="text" name="nombre" class="form-control" th:placeholder="#{contact.placeholder.name}"
                        placeholder="Your name here..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" th:text="#{contact.label.email}">Email</label>
                    <input type="email" name="email" class="form-control" th:placeholder="#{contact.placeholder.email}"
                        placeholder="ejemplo@correo.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" th:text="#{contact.label.subject}">Subject</label>
                    <input type="text" name="asunto" class="form-control"
                        th:placeholder="#{contact.placeholder.subject}" placeholder="Ej: Technical Support">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold" th:text="#{contact.label.message}">Message</label>
                    <textarea name="mensaje" class="form-control" rows="4"
                        th:placeholder="#{contact.placeholder.message}" placeholder="Write your message here..."
                        required></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane me-2"></i> <span th:text="#{contact.btn.submit}">Submit Form</span>
                </button>

                <div th:if="${success}" class="alert alert-success mt-4 border-0 text-white shadow-lg"
                    style="background-color: var(--primary);">
                    <i class="fas fa-check-circle me-2"></i> <span th:text="#{contact.msg.success}">Data sent
                        successfully!</span>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
